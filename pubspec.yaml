name: pashurakhshak
description: "PashuRakhshak - Animal Welfare, AI Identification, Pet Health, and Rescue Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend & Network
  supabase_flutter: ^2.5.4
  http: ^1.2.1
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # UI, Icons & Styling
  google_fonts: ^6.2.1

  # Hardware & Media
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Payment (India)
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
